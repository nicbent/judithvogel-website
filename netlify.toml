[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Alte Squarespace-URLs
[[redirects]]
  from = "/start"
  to = "/"
  status = 301

[[redirects]]
  from = "/coming-soon"
  to = "/"
  status = 301

[[redirects]]
  from = "/angebot-uebersicht"
  to = "/angebot"
  status = 301

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
